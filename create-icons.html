<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function createIcon(size, canvasId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  
  // 背景（赤）
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(0, 0, size, size);
  
  // 白い円
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.4, 0, Math.PI * 2);
  ctx.fill();
  
  // マイクアイコン
  ctx.fillStyle = '#dc2626';
  const micW = size * 0.15;
  const micH = size * 0.3;
  const micX = (size - micW) / 2;
  const micY = size * 0.35;
  ctx.fillRect(micX, micY, micW, micH);
  
  // マイクのスタンド
  ctx.beginPath();
  ctx.arc(size/2, micY + micH + size*0.05, size*0.08, 0, Math.PI * 2);
  ctx.fill();
  
  // ダウンロード
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = canvasId === 'c192' ? 'icon-192.png' : 'icon-512.png';
    a.click();
    URL.revokeObjectURL(url);
  });
}

createIcon(192, 'c192');
setTimeout(() => createIcon(512, 'c512'), 500);
</script>
</body>
</html>
